<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gollakou - Tout sou foutbòl</title>
<meta name="description" content="Match, rezilta, pronostik ak nouvèl foutbòl chak jou.">
<meta name="theme-color" content="#032D85">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gollakou">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg:#032D85; --card:#0B3FA8; --accent:#1E90FF; --muted:#B8C7F0; --good:#7CFC9A; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:#fff;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  #app { display:flex; flex-direction:column; height:100%; max-width:720px; margin:0 auto;
    padding-top:env(safe-area-inset-top); }
  header { display:flex; align-items:center; gap:10px; padding:12px 12px 2px; }
  header img { width:40px; height:40px; border-radius:8px; }
  header .t { flex:1; }
  header .t b { font-size:20px; display:block; }
  header .t span { font-size:12px; color:var(--muted); }
  button { font:inherit; color:#fff; border:0; cursor:pointer; }
  .small { background:var(--card); padding:8px 14px; border-radius:18px; font-size:13px; }
  #updated { padding:2px 12px 4px; font-size:11px; color:var(--muted); }
  #install { display:none; margin:6px 12px; padding:10px 12px; border-radius:12px; background:#fff; color:#032D85;
    align-items:center; gap:10px; font-size:13px; font-weight:600; }
  #install button { background:var(--accent); padding:8px 14px; border-radius:14px; font-weight:700; white-space:nowrap; }
  #install .x { background:transparent; color:#032D85; padding:4px 8px; font-size:16px; }
  #install span { flex:1; }
  #leagues { display:flex; gap:6px; overflow-x:auto; padding:4px 12px; scrollbar-width:none; flex:none; }
  #leagues::-webkit-scrollbar { display:none; }
  #leagues button { background:var(--card); padding:8px 14px; border-radius:18px; font-size:13px; white-space:nowrap; flex:none; }
  #leagues button.on { background:var(--accent); }
  #sponsor { display:none; margin:4px 12px; padding:10px 12px; border-radius:12px; background:var(--accent);
    text-align:center; font-weight:700; font-size:13px; color:#fff; text-decoration:none; }
  main { flex:1; overflow-y:auto; padding:0 12px 12px; -webkit-overflow-scrolling:touch; }
  h2 { font-size:16px; margin:14px 0 2px; }
  h3 { font-size:13px; color:var(--accent); margin:8px 0 6px; }
  .card { background:var(--card); border-radius:14px; padding:12px; margin-bottom:8px; overflow:hidden; }
  .row { display:flex; align-items:center; }
  .row .n { flex:1; font-weight:700; font-size:15px; }
  .row .n.h { text-align:right; }
  .row img { width:28px; height:28px; margin:0 6px; object-fit:contain; flex:none; }
  .row .mid { min-width:56px; text-align:center; font-weight:700; font-size:16px; }
  .info { font-size:12px; color:var(--muted); margin-top:6px; }
  .status { text-align:center; font-size:12px; font-weight:700; color:var(--muted); }
  .status.live { color:var(--good); }
  .pick { text-align:center; font-weight:700; font-size:15px; margin-top:8px; }
  .prob { text-align:center; font-weight:700; font-size:13px; color:var(--good); }
  .rank { font-size:12px; font-weight:700; color:var(--accent); margin-bottom:6px; }
  .news { padding:0; display:block; color:#fff; text-decoration:none; }
  .news img { width:100%; height:170px; object-fit:cover; display:block; background:#08338F; }
  .news .b { padding:12px; }
  .news .tt { font-weight:700; font-size:15px; }
  .news .sm { font-size:13px; color:var(--muted); margin-top:4px; }
  .news .mt { font-size:11px; color:var(--accent); font-weight:700; margin-top:6px; }
  .msg { text-align:center; color:var(--muted); padding:32px 8px; font-size:14px; }
  .disc { text-align:center; color:var(--muted); font-size:11px; padding:16px 8px 8px; line-height:1.5; }
  .offer { display:block; background:var(--accent); color:#fff; text-align:center; text-decoration:none; font-weight:700;
    padding:12px; border-radius:14px; margin-bottom:6px; font-size:14px; }
  .card.click { cursor:pointer; }
  .card.fav { box-shadow: inset 4px 0 0 #FFD166; }
  .actions { display:flex; gap:8px; margin:10px 0 4px; flex-wrap:wrap; }
  .actions button { background:var(--card); padding:10px 14px; border-radius:18px; font-size:13px; font-weight:700; }
  .favbtn { display:block; margin:6px auto 0; background:rgba(255,255,255,.14); padding:5px 12px; border-radius:14px; font-size:12px; font-weight:700; }
  .favbtn.on { background:#FFD166; color:#032D85; }
  #toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:#fff; color:#032D85; padding:10px 16px;
    border-radius:20px; font-size:13px; font-weight:700; display:none; z-index:99; max-width:90%; text-align:center; }
  #picker { position:fixed; inset:0; background:var(--bg); z-index:60; display:none; flex-direction:column;
    max-width:720px; margin:0 auto; padding-top:env(safe-area-inset-top); }
  #picker .bar1 { display:flex; align-items:center; gap:8px; padding:10px 12px; }
  #picker .bar1 button { background:var(--card); width:40px; height:40px; border-radius:20px; font-size:20px; }
  #picker .bar1 span { font-size:15px; font-weight:800; }
  #p-search { width:calc(100% - 24px); margin:0 12px 8px; padding:12px 14px; border-radius:14px; border:0; font-size:15px; background:#fff; color:#032D85; }
  #plist { flex:1; overflow-y:auto; padding:0 12px 24px; }
  .trow { display:flex; align-items:center; justify-content:space-between; padding:11px 4px; border-bottom:1px solid rgba(255,255,255,.08); font-size:14px; font-weight:600; }
  .trow button { background:rgba(255,255,255,.14); padding:7px 14px; border-radius:14px; font-size:13px; font-weight:700; }
  .trow button.on { background:#FFD166; color:#032D85; }
  #detail .bar1 .sp { flex:1; }
  nav {
  .more { text-align:right; font-size:11px; font-weight:700; color:var(--accent); margin-top:6px; }
  #detail { position:fixed; inset:0; background:var(--bg); z-index:50; display:none; flex-direction:column;
    max-width:720px; margin:0 auto; padding-top:env(safe-area-inset-top); }
  #detail .bar1 { display:flex; align-items:center; gap:8px; padding:10px 12px; }
  #detail .bar1 button { background:var(--card); width:40px; height:40px; border-radius:20px; font-size:20px; }
  #detail .bar1 span { font-size:13px; color:var(--muted); font-weight:700; }
  #dtabs { display:flex; gap:6px; padding:6px 12px; overflow-x:auto; scrollbar-width:none; }
  #dtabs button { background:var(--card); padding:9px 14px; border-radius:18px; font-size:13px; font-weight:700; white-space:nowrap; flex:none; }
  #dtabs button.on { background:var(--accent); }
  #dbody { flex:1; overflow-y:auto; padding:0 12px 24px; -webkit-overflow-scrolling:touch; }
  .big { display:flex; align-items:center; padding:12px 0 4px; }
  .big .n { flex:1; text-align:center; font-weight:700; font-size:15px; }
  .big img { width:52px; height:52px; object-fit:contain; display:block; margin:0 auto 6px; }
  .big .sc { min-width:96px; text-align:center; font-size:34px; font-weight:800; }
  .ev { display:flex; gap:10px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.08); font-size:13px; align-items:flex-start; }
  .ev .m { min-width:42px; font-weight:800; color:var(--accent); }
  .ev .i { min-width:22px; text-align:center; }
  .ev .t { flex:1; }
  .ev .t small { display:block; color:var(--muted); font-size:11px; }
  .st { margin:12px 0; }
  .st .l { display:flex; justify-content:space-between; font-size:13px; font-weight:700; }
  .st .l span:nth-child(2) { color:var(--muted); font-weight:600; }
  .bars { display:flex; height:7px; border-radius:4px; overflow:hidden; background:rgba(255,255,255,.12); margin-top:4px; }
  .bars i { background:var(--accent); display:block; }
  .bars b { background:#fff; opacity:.55; display:block; }
  .cols { display:flex; gap:10px; }
  .cols > div { flex:1; min-width:0; }
  .pl { font-size:13px; padding:4px 0; border-bottom:1px solid rgba(255,255,255,.06); }
  .pl b { color:var(--accent); display:inline-block; min-width:22px; }
  table.tb { width:100%; border-collapse:collapse; font-size:12px; }
  table.tb th { color:var(--muted); font-weight:700; text-align:center; padding:6px 3px; }
  table.tb td { padding:7px 3px; text-align:center; border-top:1px solid rgba(255,255,255,.08); }
  table.tb td.tm { text-align:left; }
  table.tb tr.me td { background:rgba(30,144,255,.35); font-weight:800; }
  table.tb img { width:16px; height:16px; vertical-align:middle; margin-right:5px; object-fit:contain; }
  nav { display:flex; gap:8px; padding:8px 8px calc(8px + env(safe-area-inset-bottom)); }
  nav { gap:5px; }
  nav button { flex:1; background:var(--card); padding:13px 0; border-radius:14px; font-weight:700; font-size:10.5px; white-space:nowrap; }
  nav button.on { background:var(--accent); }
</style>
</head>
<body>
<div id="app">
  <header>
    <img src="icon-192.png" alt="Gollakou">
    <div class="t"><b>GOLLAKOU</b><span>Tout sou foutbòl</span></div>
    <button class="small" id="shareApp" aria-label="Pataje Gollakou">↗ Pataje</button>
    <button class="small" id="refresh">Rafrechi</button>
  </header>
  <div id="updated"></div>
  <div id="install"><span id="installText">Enstale Gollakou sou telefòn ou</span><button id="installBtn">Enstale</button><button class="x" id="installClose">✕</button></div>
  <div id="leagues"></div>
  <a id="sponsor" target="_blank" rel="noopener"></a>
  <main id="content"></main>
  <nav>
    <button id="t-match" class="on">Match</button>
    <button id="t-live">An dirèk</button>
    <button id="t-picks">Meyè chwa</button>
    <button id="t-news">Nouvèl</button>
    <button id="t-blog">Blog</button>
  </nav>
</div>

<div id="toast"></div>

<div id="picker">
  <div class="bar1"><button id="p-back" aria-label="Retounen">←</button><span>⭐ Ekip favori mwen</span></div>
  <input id="p-search" type="search" placeholder="Chèche yon ekip..." autocomplete="off">
  <div id="plist"></div>
</div>

<div id="detail">
  <div class="bar1"><button id="d-back" aria-label="Retounen">←</button><span id="d-title"></span><span class="sp"></span><button id="d-share" aria-label="Pataje match la" style="width:auto;padding:0 14px;font-size:13px;font-weight:700">↗ Pataje</button></div>
  <div id="dtabs"></div>
  <div id="dbody"></div>
</div>

<script>
'use strict';
var SITE_URL = 'https://gollakou46.blogspot.com';
var LIVE_URL = 'https://raw.githubusercontent.com/louisjeanobenson61-crypto/gollakou-data/live/live.json';
var LEAGUE_ORDER = [2, 39, 140, 135, 78, 61, 3, 94, 88, 71, 13, 253];
var UPCOMING = ['NS', 'TBD'];
var FINISHED = ['FT', 'AET', 'PEN'];
var LIVE = ['1H', 'HT', '2H', 'ET', 'BT', 'P', 'LIVE', 'INT'];

// Google Analytics (statistik vizit). Mete ID ou a la: 'G-XXXXXXXXXX'. Kite l vid pou dezaktive.
var GA_ID = 'G-7XKJKVBK18';
function track(name, params) {
  try { if (window.gtag) window.gtag('event', name, params || {}); } catch (e) {}
}
(function () {
  if (!/^G-[A-Z0-9]+$/.test(GA_ID)) return;
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { window.dataLayer.push(arguments); };
  window.gtag('js', new Date());
  window.gtag('config', GA_ID, { anonymize_ip: true });
  var sc = document.createElement('script');
  sc.async = true;
  sc.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
  document.head.appendChild(sc);
})();

var state = { data: null, sponsor: null, offers: null, live: null, tab: 'match', league: '', note: '' };
var lastLoad = 0;
state.detailId = null;
state.detailTab = 'sum';

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : ''; }
function has(v) { return v !== null && v !== undefined && v !== ''; }

function pad(n) { return (n < 10 ? '0' : '') + n; }
function hhmm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseDate(s) { if (!s) return null; var d = new Date(s); return isNaN(d) ? null : d; }
function leagueRank(id) { var i = LEAGUE_ORDER.indexOf(id); return i < 0 ? 99 : i; }

function dayLabel(key, sample) {
  var now = new Date(), t = dayKey(now);
  var tm = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  var yd = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
  if (key === t) return 'Jodi a';
  if (key === dayKey(tm)) return 'Demen';
  if (key === dayKey(yd)) return 'Yè';
  if (!sample) return key;
  var s = new Intl.DateTimeFormat('fr', { weekday: 'long', day: 'numeric', month: 'long' }).format(sample);
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function ago(d) {
  if (!d) return '';
  var m = Math.floor((Date.now() - d.getTime()) / 60000);
  if (m < 1) return 'kounye a';
  if (m < 60) return m + ' min de sa';
  if (m < 1440) return Math.floor(m / 60) + ' è de sa';
  return Math.floor(m / 1440) + ' jou de sa';
}

function translateAdvice(a) {
  return String(a || '')
    .replace('Combo Double chance', 'Konbinezon doub chans')
    .replace('Combo Winner', 'Konbinezon genyen')
    .replace('Double chance', 'Doub chans')
    .replace('Winner', 'Genyen')
    .replace(' or draw', ' oswa nul')
    .replace('draw or ', 'nul oswa ')
    .replace(' or ', ' oswa ')
    .replace(' and ', ' ak ')
    .replace('goals', 'gòl');
}

function oddsText(o) {
  if (!o) return 'Kòt: pa disponib';
  var parts = [];
  if (has(o.home)) parts.push('1: ' + Number(o.home).toFixed(2));
  if (has(o.draw)) parts.push('X: ' + Number(o.draw).toFixed(2));
  if (has(o.away)) parts.push('2: ' + Number(o.away).toFixed(2));
  if (!parts.length) return 'Kòt: pa disponib';
  return 'Kòt' + (o.bookmaker ? ' (' + o.bookmaker + ')' : '') + ': ' + parts.join('  ·  ');
}

function usablePrediction(p) {
  if (!p) return null;
  if (String(p.advice || '').toLowerCase().indexOf('no predictions available') >= 0) return null;
  return p;
}

function predictionText(p) {
  if (!p || (!has(p.home) && !has(p.draw) && !has(p.away))) return 'Pronostik: pa disponib';
  return 'Pronostik: Kay ' + (p.home || '') + '  ·  Nul ' + (p.draw || '') + '  ·  Deyò ' + (p.away || '');
}

function logo(url) {
  return url ? '<img src="' + esc(safeUrl(url)) + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">'
             : '<img alt="" style="visibility:hidden">';
}

function teamsRow(m, center) {
  return '<div class="row"><div class="n h">' + esc(m.home) + '</div>' + logo(m.home_logo) +
    '<div class="mid">' + esc(center) + '</div>' + logo(m.away_logo) +
    '<div class="n">' + esc(m.away) + '</div></div>';
}

function matchCard(m) {
  var st = m.status || '';
  var upcoming = UPCOMING.indexOf(st) >= 0, finished = FINISHED.indexOf(st) >= 0, live = LIVE.indexOf(st) >= 0;
  var center = 'vs';
  if ((finished || live) && has(m.score_home) && has(m.score_away)) center = m.score_home + ' - ' + m.score_away;
  else if (upcoming) { var k = parseDate(m.kickoff); if (k) center = hhmm(k); }
  var html = '<div class="card click' + (matchHasFav(m) ? ' fav' : '') + '" data-mid="' + esc(m.id) + '">' + teamsRow(m, center);
  var s = '';
  if (live && m._unconfirmed) s = 'Dènye skò konnen · pa konfime';
  else if (live) s = st === 'HT' ? 'Mi-tan' : 'An kou' + (has(m.elapsed) ? ' · ' + m.elapsed + "'" : '');
  else if (finished && m._old) s = 'Fini · dènye skò konnen (pa konfime)';
  else if (finished) s = 'Fini';
  else if (st === 'PST') s = 'Ranvwaye';
  else if (st === 'CANC') s = 'Anile';
  else if (st === 'SUSP') s = 'Sispann';
  if (s) html += '<div class="status' + (live && !m._unconfirmed ? ' live' : '') + '">' + esc(s) + '</div>';
  if (upcoming) {
    var p = usablePrediction(m.prediction);
    html += '<div class="info">' + esc(oddsText(m.odds)) + '</div>';
    html += '<div class="info">' + esc(predictionText(p)) + '</div>';
    if (p && p.advice) html += '<div class="info">Konsey sistèm nan: ' + esc(translateAdvice(p.advice)) + '</div>';
  }
  return html + '<div class="more">' + (matchHasFav(m) ? '⭐ Ekip ou · ' : '') + 'Detay ›</div></div>';
}

function disclaimer() {
  return '<div class="disc">18+ · Pronostik ak kòt yo se estimasyon, pa gen garanti. Jwe ak responsabilite.<br>' +
    'Done: API-Football · Kòt: The Odds API · Nouvèl: BBC Sport, Sky Sports, ESPN, L\'Équipe (lyen sou atik orijinal yo).' +
    (window.gtag ? '<br>Vizit yo konte anonimman (Google Analytics).' : '') + '</div>';
}

function renderLeagues(all) {
  var box = $('leagues');
  var names = [];
  all.slice().sort(function (a, b) { return leagueRank(a.league_id) - leagueRank(b.league_id); })
    .forEach(function (m) { if (m.league && names.indexOf(m.league) < 0) names.push(m.league); });
  var html = '<button data-l="" class="' + (state.league === '' ? 'on' : '') + '">Tout</button>';
  names.forEach(function (n) {
    html += '<button data-l="' + esc(n) + '" class="' + (state.league === n ? 'on' : '') + '">' + esc(n) + '</button>';
  });
  box.innerHTML = html;
  Array.prototype.forEach.call(box.querySelectorAll('button'), function (b) {
    b.onclick = function () { state.league = b.getAttribute('data-l'); render(); };
  });
}

function renderMatches() {
  var all = (state.data.matches || []).filter(Boolean);
  $('leagues').style.display = 'flex';
  renderLeagues(all);
  var list = all.filter(function (m) { return !state.league || m.league === state.league; });
  var today = dayKey(new Date());
  function key(m) { var d = parseDate(m.kickoff); return d ? dayKey(d) : '0000-00-00'; }
  list.sort(function (a, b) {
    var da = key(a), db = key(b), pa = da < today, pb = db < today;
    if (pa !== pb) return pa ? 1 : -1;
    if (da !== db) return pa ? (da < db ? 1 : -1) : (da < db ? -1 : 1);
    var r = leagueRank(a.league_id) - leagueRank(b.league_id);
    if (r) return r;
    return (parseDate(a.kickoff) || 0) - (parseDate(b.kickoff) || 0);
  });
  if (!list.length) return actionsRow() + favSection(all) + '<div class="msg">Pa gen match pou kounye a nan lig sa yo.</div>' + disclaimer();
  var html = actionsRow() + favSection(all), lastDay = '', lastLeague = '';
  var isLiveNow = function (m) { return LIVE.indexOf(m.status) >= 0 && !m._unconfirmed; };
  var liveNow = list.filter(isLiveNow);
  if (liveNow.length) {
    html += '<h2>🔴 An kou kounye a</h2>';
    liveNow.forEach(function (m) { html += '<h3>' + esc(m.league) + '</h3>' + matchCard(m); });
    list = list.filter(function (m) { return !isLiveNow(m); });
  }
  list.forEach(function (m) {
    var dk = key(m);
    if (dk !== lastDay) { html += '<h2>' + esc(dayLabel(dk, parseDate(m.kickoff))) + '</h2>'; lastDay = dk; lastLeague = ''; }
    if (m.league !== lastLeague) { html += '<h3>' + esc(m.league + (m.country ? ' · ' + m.country : '')) + '</h3>'; lastLeague = m.league; }
    html += matchCard(m);
  });
  return html + disclaimer();
}

function renderPicks() {
  $('leagues').style.display = 'none';
  var html = '<h2 style="font-size:18px;margin-top:8px">Meyè chwa jounen an</h2>' +
    '<div class="info" style="margin:0 0 8px">10 pronostik ki gen pi gwo pwobabilite (pi ba risk), daprè done API-Football ak kòt mache a. Se pwobabilite, pa gen anyen ki garanti.</div>';
  var picks = (state.data.picks || []).filter(Boolean);
  if (!picks.length) html += '<div class="msg">Pa gen chwa disponib pou kounye a. Eseye ankò pita.</div>';
  picks.forEach(function (p, i) {
    var k = parseDate(p.kickoff);
    html += '<div class="card click" data-mid="' + esc(p.id) + '"><div class="rank">#' + (i + 1) + ' · ' + esc(p.league) + '</div>' +
      teamsRow(p, k ? hhmm(k) : 'vs') +
      '<div class="pick">Chwa: ' + esc(p.label) + '</div>' +
      '<div class="prob">Pwobabilite: ' + esc(p.prob) + '%  ·  Risk: ' + esc(p.risk) + '</div>' +
      '<div class="info">' + esc(oddsText(p.odds)) + '</div></div>';
  });
  var offers = state.offers && state.offers.offers;

function liveAgeMin() {
  if (!state.live || !state.live.updated) return 9999;
  var t = new Date(state.live.updated).getTime();
  return isNaN(t) ? 9999 : (Date.now() - t) / 60000;
}

// Put the latest live scores (live.json) on top of data.json
function applyLive() {
  if (!state.data) return;
  var matches = state.data.matches || [];
  var age = liveAgeMin();
  var ended = ['PST', 'CANC', 'ABD', 'AWD', 'WO', 'SUSP'];
  if (state.live && state.live.fixtures) {
    matches.forEach(function (m) {
      var f = state.live.fixtures[String(m.id)];
      if (!f || !f.status) return;
      var isLive = LIVE.indexOf(f.status) >= 0;
      var isFinal = FINISHED.indexOf(f.status) >= 0 || ended.indexOf(f.status) >= 0;
      if (!isLive && !isFinal) return;       // not started: keep data.json
      if (isLive && age > 25) return;        // too old to trust a "live" status
      m.status = f.status;
      m.elapsed = f.elapsed;
      m.score_home = f.score_home;
      m.score_away = f.score_away;
      m._confirmed = true;
    });
  }
  // A "live" status that nothing confirmed is only an old snapshot of data.json
  var now = Date.now();
  var u = parseDate(state.data.updated);
  var dataAge = u ? (now - u.getTime()) / 60000 : 9999;
  matches.forEach(function (m) {
    if (LIVE.indexOf(m.status) < 0 || m._confirmed) return;
    var k = parseDate(m.kickoff);
    if (k && now - k.getTime() > 3.5 * 3600 * 1000) { m.status = 'FT'; m._old = true; }
    else if (dataAge > 25) { m._unconfirmed = true; }
  });
}

  });
  var head = '<div class="big"><div class="n">' + (m.home_logo ? '<img src="' + esc(safeUrl(m.home_logo)) + '" alt="">' : '') + esc(m.home) + favBtn(m.home) +
    '</div><div class="sc">' + esc(center) + '</div><div class="n">' + (m.away_logo ? '<img src="' + esc(safeUrl(m.away_logo)) + '" alt="">' : '') + esc(m.away) + favBtn(m.away) + '</div></div>' +
    (sLabel ? '<div class="status' + (live && !m._unconfirmed ? ' live' : '') + '" style="margin-bottom:6px">' + esc(sLabel) + '</div>' : '');
  var body = state.detailTab === 'stats' ? detailStats(m, lv) : state.detailTab === 'lu' ? detailLineups(m, lv)
    : state.detailTab === 'table' ? detailStandings(m) : detailSummary(m, lv);
  var scroller = $('dbody'), keep = scroller.scrollTop;
  scroller.innerHTML = head + body + disclaimer();
  scroller.scrollTop = keep;
  $('detail').style.display = 'flex';
}

var detailOpen = false;
function openMatch(id) {
  if (!findMatch(id)) return;
  state.detailId = id;
  state.detailTab = 'sum';
  $('dbody').scrollTop = 0;
  renderDetail();
  if (!detailOpen) { detailOpen = true; try { history.pushState({ detail: 1 }, ''); } catch (e) {} }
  var m = findMatch(id);
  track('match_open', { match: (m.home + ' vs ' + m.away).slice(0, 80) });
}
function closeDetailUI() { detailOpen = false; state.detailId = null; $('detail').style.display = 'none'; }
$('d-share').onclick = function () {
  var m = state.detailId !== null ? findMatch(state.detailId) : null;
  if (m) shareText(matchShareText(m), 'match');
};
$('dbody').addEventListener('click', function (e) {
  var b = e.target && e.target.closest ? e.target.closest('[data-fav]') : null;
  if (!b) return;
  toggleFav(b.getAttribute('data-fav'));
  renderDetail();
});
$('shareApp').onclick = function () {
  shareText('⚽ Gollakou: match jodi a, skò an dirèk, rezilta ak nouvèl foutbòl. Gratis, enstale l sou telefòn ou 👇\n' + SHARE_URL, 'app');
};
$('d-back').onclick = function () { if (detailOpen) { try { history.back(); } catch (e) { closeDetailUI(); } } else closeDetailUI(); };
window.addEventListener('popstate', function () { if (detailOpen) closeDetailUI(); });

function renderSponsor() {
  var s = state.sponsor, el = $('sponsor');
  if (s && s.active && s.text) {
    el.textContent = 'Sponsò · ' + s.text;
    var u = safeUrl(s.link);
    if (u) el.setAttribute('href', u); else el.removeAttribute('href');
    el.style.display = 'block';
    el.onclick = function () { track('sponsor_click', { sponsor: String(s.text).slice(0, 60) }); };
  } else el.style.display = 'none';
}

function render() {
  ['match', 'live', 'picks', 'news'].forEach(function (t) { $('t-' + t).className = state.tab === t ? 'on' : ''; });
  renderSponsor();
  var c = $('content');
  if (!state.data) {
    $('leagues').style.display = 'none';
    $('updated').textContent = state.note;
    c.innerHTML = '<div class="msg">Done yo poko disponib. Verifye entènèt la epi peze Rafrechi.</div>';
    return;
  }
  var scrollTop = c.scrollTop;
  var u = parseDate(state.data.updated);
  var when = u ? new Intl.DateTimeFormat('fr', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).format(u) : '?';
  var liveInfo = '';
  if (liveAgeMin() < 25) {
    var lu = parseDate(state.live.updated);
    if (lu) liveInfo = ' · Skò an dirèk: ' + hhmm(lu);
  }
  $('updated').textContent = (state.note ? state.note + ' · ' : '') + 'Mizajou: ' + when + liveInfo;
  var nLive = (state.data.matches || []).filter(function (m) { return m && isLiveNow(m); }).length;
  $('t-live').textContent = nLive ? 'An dirèk · ' + nLive : 'An dirèk';
  c.innerHTML = state.tab === 'live' ? renderLive() : state.tab === 'picks' ? renderPicks() : state.tab === 'news' ? renderNews() : renderMatches();
  c.scrollTop = scrollTop;
}

function getJson(url) {
  return fetch(url + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  });
}

function load(silent) {
  if (!silent) $('updated').textContent = 'Ap chaje...';
  lastLoad = Date.now();
  var safe = function (p) { return p.catch(function () { return null; }); };
  Promise.all([safe(getJson('data.json')), safe(getJson('sponsor.json')), safe(getJson('offers.json')),
               safe(getJson(LIVE_URL))]).then(function (r) {
    if (r[0]) { state.data = r[0]; state.note = ''; }
    else state.note = state.data ? 'Pa gen koneksyon, done ki sove yo' : '';
    state.sponsor = r[1];
    state.offers = r[2];
    state.live = r[3];
    applyLive();
    render();
    if (state.detailId !== null) renderDetail();
  });
}
setInterval(function () { if (!document.hidden && state.data) load(true); }, 5 * 60 * 1000);
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && state.data && Date.now() - lastLoad > 120000) load(true);
});

function setTab(t) { state.tab = t; render(); $('content').scrollTop = 0; track('tab_view', { tab: t }); }
$('t-match').onclick = function () { setTab('match'); };
$('t-live').onclick = function () { setTab('live'); };
$('t-picks').onclick = function () { setTab('picks'); };
$('t-news').onclick = function () { setTab('news'); };
$('t-blog').onclick = function () { track('blog_click'); window.open(SITE_URL, '_blank', 'noopener'); };
$('refresh').onclick = function () { track('refresh'); load(false); };
$('content').addEventListener('click', function (e) {
  var act = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if (act) {
    if (act.getAttribute('data-act') === 'favs') openPicker();
    else {
      var txt = todayListText();
      if (txt) shareText(txt, 'today_list'); else toast('Pa gen match jodi a.');
    }
    return;
  }
  var card = e.target && e.target.closest ? e.target.closest('[data-mid]') : null;
  if (card) { openMatch(card.getAttribute('data-mid')); return; }
  var a = e.target && e.target.closest ? e.target.closest('a') : null;
  if (!a) return;
  if (a.classList.contains('news')) track('news_click', { source: (a.querySelector('.mt') || {}).textContent || '' });
  else if (a.classList.contains('offer')) track('offer_click', { name: a.textContent.slice(0, 40) });
});

// ---------- install as an app ----------
var deferredPrompt = null;
function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function showInstall(text, withButton) {
  if (isStandalone()) return;
  try { if (localStorage.getItem('installClosed') === '1') return; } catch (e) {}
  $('installText').textContent = text;
  $('installBtn').style.display = withButton ? 'inline-block' : 'none';
  $('install').style.display = 'flex';
}
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  deferredPrompt = e;
  track('install_prompt_shown');
  showInstall('Enstale Gollakou sou telefòn ou, tankou yon aplikasyon', true);
});
window.addEventListener('appinstalled', function () { track('app_install'); $('install').style.display = 'none'; deferredPrompt = null; });
$('installBtn').onclick = function () {
  if (!deferredPrompt) return;
  track('install_click');
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function () { deferredPrompt = null; $('install').style.display = 'none'; });
};
$('installClose').onclick = function () {
  $('install').style.display = 'none';
  try { localStorage.setItem('installClosed', '1'); } catch (e) {}
};
if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !isStandalone()) {
  showInstall('Sou iPhone: peze bouton Pataje, answit "Ajoute sou ekran akèy".', false);
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}

if (isStandalone()) track('app_open_installed');
render();
load();
</script>
</body>
</html>
